components:
  securitySchemes:
    basicAuth:
      type: http
      scheme: basic
  schemas:
    Vendor:
      type: object
      properties:
        id: &id009
          type: string
          format: uuid
        name: &id006
          type: string
        email: *id006
        currency: &id008
          type: string
          enum: *id007
      required:
      - id
      - name
      - email
      - currency
    VendorRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        email:
          type: string
          format: email
          maxLength: 200
        currency: *id008
      required:
      - name
      - email
      - currency
    Invoice:
      type: object
      properties:
        id: *id009
        vendorId: *id009
        vendorName: *id006
        reference: *id006
        amount: &id011
          type: string
          pattern: ^-?[0-9]+\.[0-9]{2}$
          example: '18000.00'
        currency: *id008
        dueDate: &id010
          type: string
          format: date
        status:
          type: string
          enum:
          - RECEIVED
          - APPROVED
          - REJECTED
          - PAID
        createdBy: *id006
        version: &id014
          type: integer
      required:
      - id
      - vendorId
      - vendorName
      - reference
      - amount
      - currency
      - dueDate
      - status
      - createdBy
      - version
    InvoiceRequest:
      type: object
      properties:
        vendorId: *id009
        reference:
          type: string
          pattern: ^[A-Za-z0-9._/-]{1,80}$
        amount: &id012
          oneOf:
          - type: string
            pattern: ^[0-9]+(\.[0-9]{1,2})?$
          - type: number
          description: Decimal strings are preferred to preserve exact monetary values.
        currency: *id008
        dueDate: *id010
      required:
      - vendorId
      - reference
      - amount
      - currency
      - dueDate
    Decision:
      type: object
      properties:
        reason:
          type: string
          minLength: 8
          maxLength: 500
      required:
      - reason
    BankTransaction:
      type: object
      properties:
        id: *id009
        externalId: *id006
        reference: *id006
        counterparty: *id006
        amount: *id011
        currency: *id008
        bookedOn: *id010
        matched:
          type: boolean
      required:
      - id
      - externalId
      - reference
      - counterparty
      - amount
      - currency
      - bookedOn
      - matched
    BankRequest:
      type: object
      properties:
        externalId:
          type: string
          maxLength: 100
        reference:
          type: string
          maxLength: 120
        counterparty:
          type: string
          maxLength: 120
        amount: *id012
        currency: *id008
        bookedOn: *id010
      required:
      - externalId
      - reference
      - counterparty
      - amount
      - currency
      - bookedOn
    Match:
      type: object
      properties:
        id: *id009
        invoiceId: *id009
        bankTransactionId: *id009
        matchedBy: *id006
        matchedAt: &id013
          type: string
          format: date-time
      required:
      - id
      - invoiceId
      - bankTransactionId
      - matchedBy
      - matchedAt
    MatchRequest:
      type: object
      properties:
        invoiceId: *id009
        bankTransactionId: *id009
      required:
      - invoiceId
      - bankTransactionId
    Candidate:
      type: object
      properties:
        transaction:
          $ref: '#/components/schemas/BankTransaction'
        score:
          type: integer
          minimum: 0
          maximum: 100
        reasons:
          type: array
          items: *id006
      required:
      - transaction
      - score
      - reasons
    Account:
      type: object
      properties:
        id: *id009
        code:
          type: string
          enum:
          - CASH
          - ACCOUNTS_PAYABLE
          - EXPENSE
          - EQUITY
        currency: *id008
        balance: *id011
      required:
