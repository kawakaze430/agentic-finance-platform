services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: finance
      POSTGRES_USER: finance
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:?Set DATABASE_PASSWORD}
    volumes: ["postgres-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U finance -d finance"]
      interval: 5s
      timeout: 3s
      retries: 20
  api:
    build: .
    ports: ["127.0.0.1:8080:8080"]
    depends_on:
      db:
        condition: service_healthy
    extra_hosts: ["host.docker.internal:host-gateway"]
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DATABASE_URL: jdbc:postgresql://db:5432/finance
      DATABASE_USERNAME: finance
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:?Set DATABASE_PASSWORD}
      FINANCE_ANALYST_PASSWORD: ${FINANCE_ANALYST_PASSWORD:?Set FINANCE_ANALYST_PASSWORD}
      FINANCE_APPROVER_PASSWORD: ${FINANCE_APPROVER_PASSWORD:?Set FINANCE_APPROVER_PASSWORD}
      FINANCE_ADMIN_PASSWORD: ${FINANCE_ADMIN_PASSWORD:?Set FINANCE_ADMIN_PASSWORD}
      AGENT_MODE: ${AGENT_MODE:-demo}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.1:8b}
volumes:
  postgres-data:
