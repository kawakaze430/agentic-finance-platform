name: Verify
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - run: ./mvnw -B -ntp verify
      - run: node --check src/main/resources/static/app.js
      - run: docker build -t agentic-finance-platform:ci .
      - name: Start the packaged demo
        run: docker run -d --name finance-smoke -p 8080:8080 -e SPRING_PROFILES_ACTIVE=demo agentic-finance-platform:ci
      - name: Wait for the packaged application
        run: |
          python3 - <<'PY'
          import time, urllib.request
          deadline = time.monotonic() + 120
          while time.monotonic() < deadline:
              try:
                  with urllib.request.urlopen('http://localhost:8080/actuator/health', timeout=3) as response:
                      if response.status == 200:
                          break
              except (OSError, TimeoutError):
                  pass
              time.sleep(2)
          else:
              raise SystemExit('Packaged application did not become healthy')
          PY
      - name: Verify the packaged invoice workflow
        run: python3 scripts/smoke.py
      - name: Inspect and remove the demo container
        if: always()
        run: |
          docker logs finance-smoke || true
          docker rm -f finance-smoke || true
